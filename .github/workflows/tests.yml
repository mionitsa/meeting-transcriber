name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --python ${{ matrix.python }} pytest -q

  # Bumping `version` in pyproject.toml is the release: once main passes, the version
  # gets its tag. Host programs (lifey) follow the tags, never main.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already tagged"
          else
            git tag "$tag" && git push origin "$tag"
          fi
