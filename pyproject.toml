[project]
name = "meeting-transcriber"
version = "0.2.0"
description = "Turn meeting recordings into transcripts with named speakers and a summary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=1.50",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Google Vertex AI as the LLM provider (a Gemini API key works without this)
vertex = ["google-genai>=1.0"]
# Speaker identification by voiceprint (pulls in torch, a large download)
voice = ["speechbrain>=1.0", "torch", "torchaudio", "soundfile", "numpy"]

[project.scripts]
transcribe = "meeting_transcriber.cli:main"

[dependency-groups]
dev = ["pytest>=8", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
